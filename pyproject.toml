[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "authflowguard-ai"
version = "0.1.0"
description = "Local authentication security testing for developer-owned websites"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "playwright>=1.55,<2.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
